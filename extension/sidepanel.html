<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude KYC 查询</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <div class="status-row">
      <span id="local-badge" class="local-badge">扩展内查询</span>
    </div>

    <section id="update-banner" class="update-banner" hidden>
      <div>
        <strong id="update-title"></strong>
        <p id="update-notes"></p>
      </div>
      <button id="update-button" class="primary update-button" type="button">更新</button>
    </section>

    <section class="panel compact proxy-panel">
      <label class="field">
        <span>代理 IP</span>
        <input id="proxy" name="proxy" type="text" autocomplete="off" spellcheck="false"
          placeholder="http://host:port 或 host:port:用户名:密码" maxlength="8192">
      </label>
    </section>

    <nav class="tabs" aria-label="查询模式">
      <button id="single-tab" class="tab is-active" type="button">单个查询</button>
      <button id="batch-tab" class="tab" type="button">批量查询</button>
    </nav>

    <section id="single-view">
      <section class="panel credentials">
        <form id="query-form" novalidate>
          <label class="field">
            <span>SK</span>
            <span class="secret-wrap">
              <input id="sk" name="sk" type="pass&#119;ord" autocomplete="off" spellcheck="false"
                placeholder="Claude 网页 sessionKey" maxlength="16384">
              <button id="toggle-sk" class="inline-action" type="button" aria-label="显示 SK">显示</button>
            </span>
          </label>

          <div class="form-actions">
            <button id="query-button" class="primary" type="submit">查询 KYC</button>
          </div>
        </form>
      </section>

      <section id="notice" class="notice" role="alert" hidden>
        <div class="notice-title" id="notice-title"></div>
        <p id="notice-message"></p>
      </section>

      <section id="organization-field" class="panel compact" hidden>
        <label class="field">
          <span>Claude 组织</span>
          <select id="organization" aria-label="选择 Claude 组织"></select>
        </label>
      </section>

      <section id="result" class="panel result" hidden>
        <div class="result-top">
          <div>
            <div id="status-label" class="status-label"></div>
            <div id="result-org" class="result-org"></div>
          </div>
          <div id="result-time" class="result-time"></div>
        </div>

        <div id="actions" class="result-actions">
          <button id="refresh-status" class="secondary" type="button">刷新状态</button>
          <button id="refresh-link" class="secondary" type="button">获取验证链接</button>
          <button id="retry" class="secondary" type="button" hidden>重新验证</button>
        </div>

        <div id="vendor-panel" class="vendor-panel" hidden>
          <button id="vendor-link" class="vendor-link" type="button"></button>
          <div class="vendor-meta">
            <span id="vendor-expiry"></span>
            <button id="copy-link" class="inline-action" type="button">复制链接</button>
          </div>
        </div>
      </section>
    </section>

    <section id="batch-view" hidden>
      <section class="panel credentials">
        <label class="field">
          <span>SK 列表</span>
          <textarea id="batch-sk" class="batch-input" autocomplete="off" spellcheck="false"
            placeholder="每行一个 SK"></textarea>
        </label>
        <p class="privacy-line">每行一个 SK；串行查询，固定并发 1。</p>
        <div class="batch-actions">
          <button id="batch-start" class="primary" type="button">开始验证</button>
          <button id="batch-stop" class="quiet" type="button" disabled>停止</button>
          <span id="batch-progress" class="batch-progress"></span>
        </div>
      </section>

      <section id="batch-notice" class="notice" role="alert" hidden>
        <div class="notice-title">批量查询失败</div>
        <p id="batch-notice-message"></p>
      </section>

      <section id="batch-results" class="panel batch-results" hidden>
        <div class="batch-results-head">
          <strong>验证结果</strong>
          <button id="export-xlsx" class="secondary" type="button">导出 Excel</button>
        </div>
        <div class="table-wrap">
          <table id="batch-table">
            <thead>
              <tr>
                <th class="col-index">#</th>
                <th class="col-sk">SK</th>
                <th class="col-status">状态</th>
                <th>组织</th>
              </tr>
            </thead>
            <tbody id="batch-tbody"></tbody>
          </table>
        </div>
      </section>
    </section>

    <footer class="footer">
      <span>v<span id="extension-version">1.1.1</span></span>
      <button id="check-update" class="inline-action" type="button">检查更新</button>
      <a class="footer-link" href="https://github.com/DouDOU-start/claude-kyc-extension"
        target="_blank" rel="noopener noreferrer" aria-label="GitHub repository">
        <svg class="footer-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path>
        </svg>
        <span>GitHub</span>
      </a>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
