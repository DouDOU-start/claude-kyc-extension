name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate tag and version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $manifest = [IO.File]::ReadAllText(
            (Join-Path $PWD "extension/manifest.template.json"),
            [Text.Encoding]::UTF8
          ) | ConvertFrom-Json
          $expected = "v$($manifest.version)"
          if ($tag -ne $expected) {
            throw "Tag $tag does not match extension version $expected"
          }
      - name: Build release
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            "dist/claude-kyc-extension-$tag.zip" `
            "dist/SHA256SUMS.txt" `
            --title "Claude KYC $tag" `
            --generate-notes `
            --verify-tag
