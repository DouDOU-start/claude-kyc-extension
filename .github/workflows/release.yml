name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "
            const version = require('./extension/manifest.json').version;
            if (process.env.TAG !== 'v' + version) {
              throw new Error('Tag ' + process.env.TAG + ' does not match manifest version ' + version);
            }
          "
      - name: Test
        run: node --test tests/*.test.js
      - name: Package
        run: |
          mkdir -p dist
          cd extension
          zip -r "../dist/claude-kyc-extension-${GITHUB_REF_NAME}.zip" .
          cd ..
          cd dist
          sha256sum "claude-kyc-extension-${GITHUB_REF_NAME}.zip" > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/claude-kyc-extension-${GITHUB_REF_NAME}.zip" \
            dist/SHA256SUMS.txt \
            --title "Claude KYC ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
