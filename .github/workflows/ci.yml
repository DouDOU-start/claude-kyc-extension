name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test
        run: |
          node --check extension/app.js
          node --check extension/background.js
          node --check extension/lib/api.js
          node --check extension/lib/kyc.js
          node --check extension/lib/proxy.js
          node --check extension/lib/release.js
          node --test tests/*.test.js
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"
